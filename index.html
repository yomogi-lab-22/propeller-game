<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨よけ首長人間と蛙</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b24;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
  body{cursor:crosshair}
  canvas{display:block;width:100vw;height:100vh}
  #start,#gameover{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,rgba(25,76,76,.42),rgba(3,15,22,.96));
    color:#e9f4df;text-align:center;z-index:10
  }
  .panel{width:min(560px,90vw);padding:34px 30px;border:1px solid rgba(173,211,176,.25);
    border-radius:24px;background:rgba(6,29,35,.82);box-shadow:0 24px 80px rgba(0,0,0,.45)}
  h1{margin:0 0 8px;font-size:clamp(28px,5vw,52px);letter-spacing:.08em;font-weight:800}
  .sub{opacity:.78;margin:0 0 25px}
  .levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{border:1px solid rgba(192,220,193,.35);background:#12353a;color:#eaf5df;
    padding:12px 22px;border-radius:14px;font-size:17px;cursor:pointer;transition:.18s}
  button:hover{transform:translateY(-2px);background:#1a4848}
  .hint{font-size:13px;opacity:.62;margin-top:22px;line-height:1.7}
  #hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
    color:#edf5df;text-shadow:0 3px 16px #000;font-weight:800;letter-spacing:.08em;
    text-align:center;pointer-events:none}
  #timer{font-variant-numeric:tabular-nums;font-size:clamp(46px,8vw,86px);line-height:.95}
  #status{font-size:13px;opacity:.7;margin-top:5px}
  #lives{position:fixed;top:22px;right:28px;z-index:5;color:#edf5df;text-shadow:0 3px 16px #000;font-weight:900;font-size:clamp(24px,3.2vw,42px);letter-spacing:.06em;pointer-events:none}
  #flash{position:fixed;inset:0;background:#e65b3c;opacity:0;pointer-events:none;z-index:8}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div id="timer">0</div><div id="status">雨よけ中</div></div><div id="lives" class="hidden">4/4</div>
<div id="flash"></div>

<div id="start">
  <div class="panel">
    <h1>雨よけの首長人間</h1>
    <p class="sub">蛙を雨から守れ。首長人間だけをマウスで動かそう。</p>
    <div class="levels"><button id="startButton">ゲームスタート</button></div>
    <div class="hint">マウスを動かすと首長人間が移動します。蛙は勝手に逃げます。<br>30秒ごとに雨と蛙の動きが激しくなります。</div>
  </div>
</div>

<div id="gameover" class="hidden">
  <div class="panel">
    <h1>雨、降りすぎ。</h1>
    <p id="result"></p>
    <button id="retry">もう一度遊ぶ</button>
  </div>
</div>

const start=document.getElementById('start'),over=document.getElementById('gameover');
const hud=document.getElementById('hud'),timerEl=document.getElementById('timer'),statusEl=document.getElementById('status'),lives=document.getElementById('lives');

let frog={x:innerWidth/2,y:innerHeight*.78,vx:70,vy:-25,size:1};
let rain=[],rotation=0,audioCtx=null;
let humanRise=0;
const TIMER_BOTTOM=118; // 秒数カウンターの下端付近

// 難易度は30秒ごとに自動上昇。Lv.4以降も上限なしで少しずつ激しくなる。
function difficulty(){
  const lv=level;
  return {
    count:Math.min(24+(lv-1)*14,120),
    speed:170+(lv-1)*62,
    frog:45+(lv-1)*25,
    sudden: lv===1 ? 0 : lv===2 ? .35 : Math.min(1.8,.75+(lv-3)*.28),
    suddenPower: lv===1 ? 0 : 100+(lv-2)*28
  };
}

const cfg={
  1:{count:24,speed:170,frog:45},
  2:{count:38,speed:245,frog:72},
  3:{count:55,speed:330,frog:105}
};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  mouse.x=Math.min(mouse.x,W); mouse.y=Math.min(mouse.y,H);
}
addEventListener('resize',resize); resize();

addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
document.getElementById('startButton').onclick=()=>startGame();
document.getElementById('retry').onclick=()=>{over.classList.add('hidden');start.classList.remove('hidden')};

function soundGeko(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
    o.type='square';o.frequency.setValueAtTime(420,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(250,audioCtx.currentTime+.13);
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.17);
    o2.type='triangle';o2.frequency.setValueAtTime(170,audioCtx.currentTime+.08);o2.frequency.exponentialRampToValueAtTime(95,audioCtx.currentTime+.25);
    g2.gain.setValueAtTime(.0001,audioCtx.currentTime+.08);g2.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.1);g2.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
    o2.connect(g2).connect(audioCtx.destination);o2.start(audioCtx.currentTime+.08);o2.stop(audioCtx.currentTime+.3);
  }catch(e){}
}

function startGame(){
  level=1; running=true; protect=0; score=0; remainingHits=5; rotation=0; rain=[]; gameTime=0; flashUntil=0;
  player.x=W/2;player.y=H*.43; humanRise=0;
  const c=difficulty();
  frog={x:W/2,y:H*.79,vx:(Math.random()-.5)*c.frog*2,vy:(Math.random()-.5)*c.frog*1.5,size:1};
  for(let i=0;i<c.count;i++) rain.push(makeRain(true));
  start.classList.add('hidden');over.classList.add('hidden');hud.classList.remove('hidden');lives.classList.remove('hidden');lives.textContent='5/5';
  last=performance.now(); requestAnimationFrame(loop);
}
function makeRain(initial=false){
  const c=difficulty(),r=7+Math.random()*5;
  return {x:Math.random()*W,y:initial?Math.random()*H:-20-Math.random()*160,r,seed:Math.random(),vy:c.speed*(.78+Math.random()*.44),sway:(Math.random()-.5)*12,phase:Math.random()*6.28};
}

function update(dt){
  gameTime+=dt;
  level=Math.floor(gameTime/30)+1;
  const c=difficulty();

  // レベル上昇に合わせて雨粒数も増やす。
  while(rain.length<c.count) rain.push(makeRain());
  while(rain.length>c.count) rain.pop();

  // 首長人間だけがマウスに追従。蛙は完全に独立して動く。
  player.x += (mouse.x-player.x)*Math.min(1,dt*10);
  const desiredY = mouse.y - humanRise;
  player.y += (desiredY-player.y)*Math.min(1,dt*10);
  player.x=Math.max(90,Math.min(W-90,player.x));
  player.y=Math.max(70,Math.min(H*.66-humanRise,player.y));
  rotation+=dt*(3.2+level*.55);

  // 蛙のランダム移動。Lv.1はゆっくり、Lv.2から急な方向転換が入り、Lv.3以降は頻繁になる。
  frog.x+=frog.vx*dt; frog.y+=frog.vy*dt;
  const frogR=38*frog.size;
  if(frog.x-frogR<10||frog.x+frogR>W-10){
    frog.vx*=-1; frog.x=Math.max(10+frogR,Math.min(W-10-frogR,frog.x));
  }
  if(frog.y-frogR<H*.61||frog.y+frogR>H-10){
    frog.vy*=-1; frog.y=Math.max(H*.61+frogR,Math.min(H-10-frogR,frog.y));
  }
  if(level===1 && Math.random()<dt*.65){
    frog.vx+=(Math.random()-.5)*c.frog*.7;
    frog.vy+=(Math.random()-.5)*c.frog*.5;
  }
  if(level>=2 && Math.random()<dt*c.sudden){
    const angle=Math.random()*Math.PI*2;
    const power=c.suddenPower*(level===2 ? .8 : 1);
    frog.vx=Math.cos(angle)*power;
    frog.vy=Math.sin(angle)*power*.75;
  }
  const max=c.frog*(level===1?1.35:1.65);
  frog.vx=Math.max(-max,Math.min(max,frog.vx));
  frog.vy=Math.max(-max*.75,Math.min(max*.75,frog.vy));

  let hit=false;
  for(const p of rain){
    const targetRainSpeed=c.speed*(.78+((p.seed||0)*.44));
    p.vy += (targetRainSpeed-p.vy)*Math.min(1,dt*3);
    p.y+=p.vy*dt;
    p.x+=Math.sin(p.phase+p.y*.015)*p.sway*dt;
    if(p.y>H+30){Object.assign(p,makeRain());continue}

    // 首長人間に当たった雨は、その場で消える。
    if(hitsNeckHuman(p.x,p.y,p.r)){
      p.y=H+80;
      continue;
    }

    // 蛙に当たった雨だけが巨大化を発生させる。
    const frogHitRadius=30*frog.size;
    if(Math.hypot(p.x-frog.x,p.y-frog.y)<p.r+frogHitRadius){
      hit=true;
      p.y=H+80;
    }
  }

  if(hit){
    frog.size*=2;          // 雨に当たるたび倍々に巨大化
    humanRise += 42;       // 巨大化するたび首長人間も上昇
    protect=10;            // 被弾から10秒守れば一段階戻る
    flashUntil=0;
    score++;
    remainingHits--;
    lives.textContent=`${remainingHits}/5`;
    timerEl.textContent='10';
    soundGeko();

    // 5回目の被弾でゲームオーバー。
    if(remainingHits<=0){
      endGame();
      return;
    }
  }

  if(protect>0){
    protect-=dt;
    if(protect<=0){
      if(frog.size>1){
        frog.size=Math.max(1,frog.size/2); // 一段階だけ元に戻す
        humanRise=Math.max(0,humanRise-42);
      }
      flashUntil=gameTime+2;             // 蛙の体だけを2秒間ゆっくり朱色に点滅
      protect=0;
    }
    timerEl.textContent=Math.max(0,Math.ceil(protect));
  }else{
    timerEl.textContent='0';
  }
  statusEl.textContent=`LEVEL ${level}　雨よけ中　｜　被弾 ${score}`;
}

function frogOutOfScreen(){
  const rx=42*frog.size, ry=48*frog.size;
  return frog.x-rx<0 || frog.x+rx>W || frog.y-ry<0 || frog.y+ry>H;
}

function humanNearTimer(){
  // 首長人間の頭が、画面上部の秒数カウンター付近まで上がったら終了。
  return player.y - 70 <= TIMER_BOTTOM;
}

function hitsNeckHuman(x,y,r){
  // 元イラストの頭・長い首・体をまとめて雨よけ判定にする。
  // 描画位置：画像左上は (player.x-70, player.y-62)
  const ox=player.x-70, oy=player.y-62;
  const pts=[
    [45,45],[75,30],[105,42],[125,75],       // 頭
    [145,100],[175,108],[210,100],[245,82],  // 首
    [275,78],[305,92],[325,112],             // 右側
    [275,128],[235,125],[200,142],[160,152],
    [120,150],[95,125],[70,105],[48,85]
  ];
  if(pointInPolygon(x,y,pts.map(([px,py])=>[ox+px,oy+py]))) return true;
  // 回転する頭上のヘリコプター風ブレードも雨よけになる。
  const hx=player.x+2, hy=player.y-2;
  const dx=x-hx,dy=y-hy,dist=Math.hypot(dx,dy);
  if(dist<112){
    let a=Math.atan2(dy,dx)-rotation;
    a=(a%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const sector=Math.PI*2/3;
    const blade=Math.min(a%sector,sector-(a%sector));
    if(blade<.20) return true;
  }
  return false;
}

function pointInPolygon(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    const intersect=((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

function endGame(){
  running=false;
  hud.classList.add('hidden');
  lives.classList.add('hidden');
  over.classList.remove('hidden');
  document.getElementById('result').textContent = `蛙に雨が5回当たりました！　被弾 ${score}回`; 
}

function triggerFlash(){ /* 蛙の体側で点滅します */ }

function draw(){
  // night pond
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071b2b');g.addColorStop(.55,'#0b3340');g.addColorStop(1,'#123f3b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mist
  ctx.fillStyle='rgba(118,190,157,.06)';
  for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(W*(i/6-.08),H*(.25+i%3*.17),180,35,0,0,Math.PI*2);ctx.fill()}
  // pond
  ctx.fillStyle='rgba(14,77,72,.55)';ctx.fillRect(0,H*.58,W,H*.42);
  // lily pads
  for(let i=0;i<8;i++){
    const x=(i*173+80)%W,y=H*(.68+(i%3)*.09);
    ctx.fillStyle='rgba(47,112,75,.7)';ctx.beginPath();ctx.arc(x,y,18+(i%2)*8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#123f3b';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y-4);ctx.lineTo(x+5,y+14);ctx.closePath();ctx.fill();
  }
  // rain
  ctx.lineCap='round';
  for(const p of rain){
    ctx.strokeStyle='rgba(167,219,220,.68)';ctx.lineWidth=p.r;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.sway*.06,p.y+p.r*2.6);ctx.stroke();
  }
  drawCharacter();
  drawFrog();
}
function drawCharacter(){
  const x=player.x,y=player.y;
  // User's original long-neck character: used directly as the rain shield.
  // The head is the center of the shield; the rest of the body extends behind it.
  ctx.save();
  ctx.translate(x,y);
  const scale=Math.min(1.0, Math.max(.72, W/1100));
  ctx.globalAlpha=.98;
  ctx.drawImage(neckHumanImg,-70,-62,337*scale,212*scale);
  ctx.restore();

  // 白い「人魂」のような3枚羽根。根元は細く、先端ほど太く丸いプロペラ形状。
  ctx.save();
  ctx.translate(x,y-2);
  ctx.rotate(rotation);
  for(let i=0;i<3;i++){
    ctx.rotate(Math.PI*2/3);
    ctx.fillStyle='rgba(245,250,242,.20)';
    ctx.beginPath();
    ctx.moveTo(8,-5);
    ctx.bezierCurveTo(30,-8,62,-15,91,-10);
    ctx.bezierCurveTo(106,-8,116,0,108,9);
    ctx.bezierCurveTo(101,19,87,20,78,13);
    ctx.bezierCurveTo(58,1,34,2,10,5);
    ctx.quadraticCurveTo(4,0,8,-5);
    ctx.closePath();
    ctx.fill();
  }
  // 中央の小さな留め具
  ctx.fillStyle='rgba(235,242,235,.12)';
  ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawFrog(){
  const x=frog.x,y=frog.y,s=frog.size;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // 10秒経過で縮小した直後だけ、蛙の「体」そのものがゆっくり朱色に点滅。
  let bodyColor='#3f9a67';
  if(gameTime<flashUntil){
    const phase=(flashUntil-gameTime)/2;
    const pulse=(Math.sin((1-phase)*Math.PI*4)+1)/2;
    bodyColor=pulse>.5 ? '#e65b3c' : '#3f9a67';
  }

  ctx.fillStyle=bodyColor;
  ctx.beginPath();ctx.ellipse(0,12,38,29,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#56ad70';
  ctx.beginPath();
  ctx.ellipse(-23,-10,14,14,0,0,Math.PI*2);
  ctx.ellipse(23,-10,14,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#132d24';
  ctx.beginPath();ctx.arc(-23,-11,5,0,Math.PI*2);ctx.arc(23,-11,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#173b2c';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,15,19,.15,Math.PI-.15);ctx.stroke();
  ctx.fillStyle='#6cc07c';
  ctx.beginPath();ctx.ellipse(-15,38,12,7,-.2,0,Math.PI*2);ctx.ellipse(15,38,12,7,.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function loop(t){
  if(!running)return;
  const dt=Math.min(.035,(t-last)/1000);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
